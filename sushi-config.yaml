    valueCode: trial-use
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-fmm
    valueInteger: 1
publisher:
  name: CDC National Healthcare Safety Network (NHSN)
  url: http://www.cdc.gov/nhsn
  email: nhsn@cdc.gov


