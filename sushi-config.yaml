title: CDC National Healthcare Safety Network (NHSN) Digital Quality Measures (dQM)
name: NHSNMeasures
status: active
date: 2023-09-14
copyrightYear: 2023+
version: 1.0.0-cibuild  
releaseLabel: Continuous Integration
jurisdiction: urn:iso:std:iso:3166#US
extension:
