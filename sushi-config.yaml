     description: Library of NHSN Glycemic Control Hypoglycemic Initial Population Measure
     #exampleCanonical: http://www.cdc.gov/nhsn/fhirportal/dqm/ig/StructureDefinition/
   
   Library/NHSNRespiratoryPathogensSurveillanceInitialPopulation:
     name: NHSN Respiratory Pathogens Surveillance Initial Population
     description: Library of NHSN Respiratory Pathogens Surveillance Initial Population Measure
     #exampleCanonical: http://www.cdc.gov/nhsn/fhirportal/dqm/ig/StructureDefinition/
   
   Library/NHSNdQMAcuteCareHospitalInitialPopulation:
     name: NHSN dQM Acute Care Hospital Initial Population
     description: Library of NHSN dQM Acute Care Hospital Initial Population Measure
     #exampleCanonical: http://www.cdc.gov/nhsn/fhirportal/dqm/ig/StructureDefinition/
   
   
   
   Library/FHIRCommon:
     name: FHIR Common
     description: This library defines terminologies and functions commonly used in FHIR-based CQL artifacts.
     #exampleCanonical: http://www.cdc.gov/nhsn/fhirportal/dqm/ig/StructureDefinition/
   
   Library/FHIRHelpers:
     name: FHIR Helpers
     description: "This library defines functions to convert between FHIR data types and CQL system-defined types, as well as functions to support FHIRPath implementation. For more information, the FHIRHelpers wiki page: https://github.com/cqframework/clinical_quality_language/wiki/FHIRHelpers"
