  ext-libs:
    name: "Knowledge Artifacts: Helper and External Libraries"
    resources:
      Library/SharedResourceCreation:
        name: Shared Resource Creation
        description: A library used to remove data elements from FHIR resources that are deemed unnecessary and/or unwanted by NHSN.
      Library/NHSNHelpers:
        name: NHSN Helpers
        description: This library is a collection of commonly used functions from various third party libraries and other created functions for use within the NHSN Measures.
      Library/FHIRHelpers:
        name: FHIR Helpers
        description: "This library defines functions to convert between FHIR data types and CQL system-defined types, as well as functions to support FHIRPath implementation. For more information, the FHIRHelpers wiki page: https://github.com/cqframework/clinical_quality_language/wiki/FHIRHelpers"
