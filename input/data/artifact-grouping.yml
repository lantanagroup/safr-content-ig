  measures:
    name: "Knowledge Artifacts: Digital Quality Measures"
    resources:
      # - Measure/NHSNGlycemicControlHypoglycemicInitialPopulation
      Measure/NHSNAcuteCareHospitalMonthlyInitialPopulation:
        name: NHSN ACH Monthly Initial Population Measure
        description: The ACH Monthly Initial Population includes all encounters for patients of any age in an emergency department (ED), observation, or inpatient location or all encounters for patients of any age with an ED, observation, inpatient, or short stay status during the measurement period.
      Measure/NHSNAcuteCareHospitalDailyInitialPopulation:
        name: NHSN ACH Daily Initial Population Measure
        description: All encounters with an inpatient, observation, or short stay status for patients of any age during the measurement period.

      # - Measure/NHSNBedCapacityMeasure

