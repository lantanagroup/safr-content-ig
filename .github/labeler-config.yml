# Add 'cql-change' label to any CQL file changes within the 'input/cql' folder 
cql-change:
- changed-files:
  - any-glob-to-any-file: 
    - 'input/cql/*.cql'

# Add 'fsh-change' label to any file changes within the '/fsh' folder 
fsh-change:
- changed-files:
  - any-glob-to-any-file: 
    - 'input/fsh/**'
